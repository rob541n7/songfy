<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songfy</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(#2a1f57, #000 65%); color: #fff; font: 16px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; box-sizing: border-box; text-align: center; }
  svg.logo { width: 84px; height: 84px; }
  h1 { font-size: 30px; margin: 18px 0 6px; }
  p { color: #b3b3b3; margin: 0; line-height: 1.5; }
  .spin { width: 28px; height: 28px; border: 3px solid #7c5cff; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; margin: 28px auto 12px; }
  @keyframes s { to { transform: rotate(360deg); } }
  #err { display: none; text-align: left; width: 100%; }
  pre { background: #121212; color: #f15e6c; padding: 12px; border-radius: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-word; max-height: 45vh; overflow: auto; }
  button { width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 500px; background: #fff; color: #000; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#7c5cff"/><path d="M9 19c2-3 4-3 6 0s4 3 6 0M9 13c2-3 4-3 6 0s4 3 6 0" stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
  <h1>Songfy</h1>
  <div id="wait">
    <div class="spin"></div>
    <p>Menyiapkan mesin musik…<br><span style="font-size:13px;color:#7a7a7a">Pembukaan pertama setelah dipasang bisa sampai 30 detik.</span></p>
  </div>
  <div id="err">
    <p style="margin-top:20px">Mesin musik gagal dinyalakan. Detail kesalahan:</p>
    <pre id="msg"></pre>
    <button onclick="SongfyStart.retry()">Tutup &amp; buka ulang</button>
  </div>
<script>
  window.showError = (m) => {
    document.getElementById("wait").style.display = "none";
    document.getElementById("err").style.display = "block";
    document.getElementById("msg").textContent = m;
  };
</script>
</body>
</html>
